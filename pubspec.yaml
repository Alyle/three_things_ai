name: three_things_ai
description: "A new Flutter project."
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  get: ^4.6.6
  uuid: ^4.2.2
  shared_preferences: ^2.2.2
  flutter_slidable: ^3.1.2
  path_provider: ^2.0.15
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0 

flutter:
  uses-material-design: true
  
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: fonts/NotoSansCJKsc-Regular.otf
        - asset: fonts/NotoSansCJKsc-Medium.otf
          weight: 500
        - asset: fonts/NotoSansCJKsc-Bold.otf
          weight: 700 